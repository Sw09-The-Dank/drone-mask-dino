# Detectron2 Mask R-CNN R50-FPN 1x adapted for this project.
# Self-contained config to avoid _BASE_ path-resolution issues.
#
# Schedule scaling notes:
# - 1x baseline ratios: STEPS=(60000, 80000), MAX_ITER=90000
#   -> step ratios are 0.6667 and 0.8889 of MAX_ITER.
# - For full dataset (50637 images, 80% train = 40510) with IMS_PER_BATCH=32:
#   iters/epoch = ceil(40510/32) = 1266
#   MAX_ITER = 10 * 1266 = 12660
#   STEPS ~= (8440, 11253)

VERSION: 2

MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHTS: "/workspace/output/maskrcnn/scale25/model_final.pth"
  MASK_ON: True
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
    FREEZE_AT: 4  # freeze all ResNet stages (res2-res5); only FPN+heads train
  RESNETS:
    DEPTH: 50
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ANCHOR_GENERATOR:
    SIZES: [[32], [64], [128], [256], [512]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 4000
    PRE_NMS_TOPK_TEST: 2000
    POST_NMS_TOPK_TRAIN: 2000
    POST_NMS_TOPK_TEST: 1500
  ROI_HEADS:
    NAME: "StandardROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    BATCH_SIZE_PER_IMAGE: 512
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
  ROI_MASK_HEAD:
    NAME: "MaskRCNNConvUpsampleHead"
    NUM_CONV: 4
    POOLER_RESOLUTION: 14

DATALOADER:
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 32
  BASE_LR: 0.0008  # 10x lower than scratch — fine-tuning from pretrained checkpoint
  MAX_ITER: 12660   # 25 epochs: ceil(40510/32)*25
  STEPS: (8440, 11253)
  WARMUP_ITERS: 2000  # longer warmup to ease into the augmented data
  WARMUP_FACTOR: 0.01
  CHECKPOINT_PERIOD: 5000

TEST:
  EVAL_PERIOD: 2000

INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MAX_SIZE_TRAIN: 1333
