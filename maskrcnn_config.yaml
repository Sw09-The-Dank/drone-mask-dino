# Self-contained config — merged from:
#   detectron2/configs/Base-RCNN-FPN.yaml
#   detectron2/configs/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml
# Project-specific overrides are applied on top.

VERSION: 2

MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  # Pretrained backbone weights (resume_or_load() will override with checkpoint when present).
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  MASK_ON: True
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
  RESNETS:
    DEPTH: 50
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ANCHOR_GENERATOR:
    # Smaller anchors to better match small drone instances.
    SIZES: [[8], [16], [32], [64], [128]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    # Increased proposal budget to improve recall on hard/small objects.
    PRE_NMS_TOPK_TRAIN: 4000
    POST_NMS_TOPK_TRAIN: 2000
    PRE_NMS_TOPK_TEST: 2000
    POST_NMS_TOPK_TEST: 1000
  ROI_HEADS:
    NAME: "StandardROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    BATCH_SIZE_PER_IMAGE: 256
    # train.py may infer this from JSON categories at runtime.
    NUM_CLASSES: 8
    SCORE_THRESH_TEST: 0.3
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
  ROI_MASK_HEAD:
    NAME: "MaskRCNNConvUpsampleHead"
    NUM_CONV: 4
    POOLER_RESOLUTION: 14

DATASETS:
  # Registered by run_default_trainer(...)
  TRAIN:
    - drone_train_polygons
  TEST:
    - drone_val_polygons

DATALOADER:
  # Keep workers moderate for Docker stability.
  NUM_WORKERS: 8
  SAMPLER_TRAIN: TrainingSampler

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.0003
  MAX_ITER: 360000
  WARMUP_ITERS: 1000
  STEPS: [240000, 320000]
  GAMMA: 0.1
  CHECKPOINT_PERIOD: 5000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "norm"
    CLIP_VALUE: 1.0

TEST:
  EVAL_PERIOD: 20000

INPUT:
  # Higher train/test scales generally improve small-object instance recall.
  MIN_SIZE_TRAIN: [640, 800, 960, 1024]
  MAX_SIZE_TRAIN: 1600
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TEST: 1600

# train.py explicitly sets OUTPUT_DIR near the end of setup.
OUTPUT_DIR: output/maskrcnn/def
