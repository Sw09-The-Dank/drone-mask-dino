# Resolved from aug7size&anchorfull101.txt
# Command-only runtime args:
#   --train-json /workspace/dataset/swapaug7/train.json
#   --val-json /workspace/dataset/swapaug7/val.json
#   --images-root /workspace/dataset/swapaug7
#   --output output/maskrcnn/swapaug7size+anchorfull101
#   --epochs 25
#   --gaussian-blur 0.1 0.1 1.0
#   --motion-blur 0.1 1 10
#   --gaussian-noise 0.1 0.0 10

VERSION: 2

MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-101.pkl"
  MASK_ON: True
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
  RESNETS:
    DEPTH: 101
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ANCHOR_GENERATOR:
    SIZES: [[8, 32], [16, 64], [32, 128], [64, 256], [128, 512]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 2000
    PRE_NMS_TOPK_TEST: 1000
    POST_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TEST: 1000
  ROI_HEADS:
    NAME: "StandardROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    BATCH_SIZE_PER_IMAGE: 512
    NUM_CLASSES: 8
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 14
  ROI_MASK_HEAD:
    NAME: "MaskRCNNConvUpsampleHead"
    NUM_CONV: 4
    POOLER_RESOLUTION: 28

DATALOADER:
  NUM_WORKERS: 8

SOLVER:
  IMS_PER_BATCH: 32
  BASE_LR: 0.008
  MAX_ITER: 2900
  STEPS: (773, 1031)
  WARMUP_ITERS: 500
  CHECKPOINT_PERIOD: 500

TEST:
  EVAL_PERIOD: 500

INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800, 900, 1080)
  MAX_SIZE_TRAIN: 1920

DATASETS:
  TRAIN: ("drone_train_polygons",)
  TEST: ("drone_val_polygons",)

OUTPUT_DIR: "output/maskrcnn/swapaug7size+anchorfull101"
